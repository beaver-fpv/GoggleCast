name: 功能建议 / Feature request
description: 提出新功能、兼容性或翻译建议。
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: use-case
    attributes:
      label: 使用场景 / Use case
      description: 你希望解决什么实际问题？目前的操作哪里不方便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的功能 / Proposed behavior
      description: 请描述希望看到的操作和结果，必要时附示意图。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 相关环境 / Relevant environment
      description: 涉及设备兼容时，写明眼镜型号、固件和 Windows 版本；翻译建议请注明语言。不要提供密码或设备完整编号。
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的方法 / Alternatives tried
      description: 可选，说明目前的替代方法及其限制。
