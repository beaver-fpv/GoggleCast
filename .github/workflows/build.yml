name: Windows build and checks

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build with the Windows .NET Framework compiler
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.ps1 -Output (Join-Path $env:GITHUB_WORKSPACE 'dist')

      - name: Check DLNA against local mock receivers
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\CheckProtocol.ps1

      - name: Start and render the WPF interface
        run: |
          $ErrorActionPreference = 'Stop'
          $review = Join-Path $env:GITHUB_WORKSPACE 'ci-evidence'
          New-Item -ItemType Directory -Path $review -Force | Out-Null
          $application = Join-Path $env:GITHUB_WORKSPACE 'dist\GoggleCast.exe'
          $image = Join-Path $review 'ui-smoke.png'
          $arguments = @('--ui-smoke', ('"' + $image + '"'), '1100', '760')
          $process = Start-Process -FilePath $application -ArgumentList $arguments -PassThru -WindowStyle Hidden
          if (!$process.WaitForExit(30000)) {
            $process.Kill()
            throw 'The WPF startup check did not finish within 30 seconds.'
          }
          if ($process.ExitCode -ne 0) { throw ('WPF startup failed: ' + $process.ExitCode) }
          if (!(Test-Path -LiteralPath $image) -or (Get-Item -LiteralPath $image).Length -eq 0) {
            throw 'The WPF startup check did not produce its screenshot.'
          }

      - name: Create the portable package and SHA-256 checksums
        run: |
          $ErrorActionPreference = 'Stop'
          $packageRoot = Join-Path $env:RUNNER_TEMP 'gogglecast-package'
          $application = Join-Path $packageRoot 'GoggleCast'
          $output = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Path $application, $output -Force | Out-Null
          $names = @('GoggleCast.exe', 'MainWindow.xaml', 'README.txt', 'THIRD-PARTY-NOTICES.txt')
          foreach ($name in $names) {
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE ('dist\' + $name)) -Destination $application
          }
          if (Test-Path -LiteralPath 'LICENSE') { Copy-Item -LiteralPath 'LICENSE' -Destination $application }
          $label = 'dev-' + $env:GITHUB_SHA.Substring(0, 7)
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $label = $env:GITHUB_REF_NAME -replace '[^a-zA-Z0-9._-]', '-' }
          $archive = Join-Path $output ('GoggleCast-' + $label + '-windows-x64.zip')
          Compress-Archive -LiteralPath $application -DestinationPath $archive -CompressionLevel Optimal
          $archiveHash = Get-FileHash -LiteralPath $archive -Algorithm SHA256
          ($archiveHash.Hash.ToLowerInvariant() + '  ' + [IO.Path]::GetFileName($archive)) |
            Set-Content -LiteralPath (Join-Path $output 'SHA256SUMS.txt') -Encoding ASCII
          $contentHashes = foreach ($file in Get-ChildItem -LiteralPath $application -File | Sort-Object Name) {
            $hash = Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256
            $hash.Hash.ToLowerInvariant() + '  GoggleCast/' + $file.Name
          }
          $contentHashes | Set-Content -LiteralPath (Join-Path $output 'PACKAGE-CONTENTS-SHA256.txt') -Encoding UTF8

      - name: Prepare the pinned Inno Setup compiler
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $compilerSetup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $compilerSetup
          $expected = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          if ((Get-FileHash -LiteralPath $compilerSetup -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'The Inno Setup compiler download does not match its pinned SHA-256.'
          }
          $signature = Get-AuthenticodeSignature -FilePath $compilerSetup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -ne 'CN=Pyrsys B.V., O=Pyrsys B.V., S=Noord-Holland, C=NL') {
            throw 'The Inno Setup compiler download has an unexpected Authenticode signature.'
          }
          $compilerDirectory = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', '/PORTABLE=1', '/NOICONS', ('/DIR="' + $compilerDirectory + '"'))
          $process = Start-Process -FilePath $compilerSetup -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw ('Preparing Inno Setup failed: ' + $process.ExitCode) }
          if (!(Test-Path -LiteralPath (Join-Path $compilerDirectory 'ISCC.exe'))) { throw 'ISCC.exe was not found after preparing the compiler.' }

      - name: Prepare the pinned FFmpeg archive for the offline installer
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Get-Content -LiteralPath 'installer\runtime.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP $runtime.archiveName
          try {
            Invoke-WebRequest -UseBasicParsing -Uri $runtime.url -OutFile $archive
          } catch {
            Invoke-WebRequest -UseBasicParsing -Uri $runtime.mirrorUrl -OutFile $archive
          }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $runtime.archiveSha256.ToLowerInvariant()) {
            throw 'The FFmpeg runtime archive does not match its pinned SHA-256.'
          }

      - name: Build the offline one-click installer
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '0.1.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME -replace '^v', '' }
          $compiler = Join-Path $env:RUNNER_TEMP 'InnoSetup\ISCC.exe'
          $runtime = Get-Content -LiteralPath 'installer\runtime.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP $runtime.archiveName
          .\build-installer.ps1 -Version $version -Iscc $compiler -RuntimeArchive $archive -SkipBuild
          $setup = Join-Path $env:GITHUB_WORKSPACE ('artifacts\GoggleCast-' + $version + '-Setup.exe')
          $hash = Get-FileHash -LiteralPath $setup -Algorithm SHA256
          ($hash.Hash.ToLowerInvariant() + '  ' + [IO.Path]::GetFileName($setup)) |
            Add-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'artifacts\SHA256SUMS.txt') -Encoding ASCII

      - name: Upload Windows builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GoggleCast-windows-x64-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload check evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-check-evidence-${{ github.sha }}
          path: |
            ci-evidence/*.png
            tests/protocol-check-results.txt
            dist/startup-error.txt
          if-no-files-found: warn
          retention-days: 14
